<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Linux find regex terminal example</title>
  <desc id="desc">A dark terminal-style diagram comparing a repeated find name command with a cleaner regex command and expected archive-file output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#10212a"/>
      <stop offset="1" stop-color="#071116"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#001018" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="560" rx="34" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="70" y="58" width="1060" height="444" rx="22" fill="#07161c" stroke="#67d6b4" stroke-opacity="0.36"/>
    <circle cx="105" cy="92" r="8" fill="#ff6b6b"/>
    <circle cx="132" cy="92" r="8" fill="#ffd166"/>
    <circle cx="159" cy="92" r="8" fill="#5be38c"/>
    <text x="80" y="137" fill="#8fc7d4" font-family="monospace" font-size="24">~/example $ tree</text>
    <text x="104" y="177" fill="#d7f6ff" font-family="monospace" font-size="22">downloads/</text>
    <text x="104" y="211" fill="#d7f6ff" font-family="monospace" font-size="22">├── backup.tar.gz</text>
    <text x="104" y="245" fill="#d7f6ff" font-family="monospace" font-size="22">├── notes.txt</text>
    <text x="104" y="279" fill="#d7f6ff" font-family="monospace" font-size="22">├── source.ZIP</text>
    <text x="104" y="313" fill="#d7f6ff" font-family="monospace" font-size="22">└── vm-image.7z</text>
    <text x="80" y="364" fill="#8fc7d4" font-family="monospace" font-size="24">~/example $ find ./downloads -regextype egrep -iregex '.*\.(gz|zip|tar|rar|7z)'</text>
    <text x="104" y="406" fill="#f4f7d5" font-family="monospace" font-size="22">./downloads/backup.tar.gz</text>
    <text x="104" y="440" fill="#f4f7d5" font-family="monospace" font-size="22">./downloads/source.ZIP</text>
    <text x="104" y="474" fill="#f4f7d5" font-family="monospace" font-size="22">./downloads/vm-image.7z</text>
  </g>
</svg>
